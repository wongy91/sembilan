<!doctype html>
<!-- Source of public/social-preview.jpg, the 1200×630 image shown when a Sembilan link is shared. Open it in a browser at 1200×630 and save a screenshot as JPEG (under 300 KB). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Nunito; src: url('../public/fonts/nunito-latin.woff2') format('woff2'); font-weight: 200 1000; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    display: grid; grid-template-columns: 330px 1fr; align-items: center; gap: 64px; padding: 0 90px; box-sizing: border-box;
    background: linear-gradient(150deg, #1d72ff 0%, #0f3fae 45%, #0a2577 100%);
    font-family: Nunito, sans-serif; color: #fff;
  }
  .roads { position: absolute; inset: 0; width: 100%; height: 100%; }
  .roads path { fill: none; stroke: #fff; stroke-opacity: 0.07; stroke-width: 26; stroke-linecap: round; }
  .icon { position: relative; width: 330px; height: 330px; filter: drop-shadow(0 24px 40px rgba(0, 16, 61, 0.55)); }
  .text { position: relative; display: grid; gap: 18px; }
  h1 { margin: 0; font-size: 112px; font-weight: 900; line-height: 1; letter-spacing: -0.02em; }
  .tagline { font-size: 46px; font-weight: 800; line-height: 1.15; color: #ffd84a; }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
  .chips span { padding: 8px 18px; border-radius: 999px; background: rgba(255, 255, 255, 0.14); font-size: 25px; font-weight: 800; }
</style>
</head>
<body>
  <svg class="roads" viewBox="0 0 1200 630" aria-hidden="true"><path d="M-40 520 C260 450 420 640 720 560 S1080 420 1260 470"/><path d="M980 -40 C900 160 1060 320 980 680"/></svg>
  <img class="icon" src="../public/icons/icon.svg" alt="">
  <div class="text">
    <h1>Sembilan</h1>
    <div class="tagline">Free navigation for Malaysia</div>
    <div class="chips"><span>English &amp; Malay voice</span><span>PLUS toll fares</span><span>Live traffic</span><span>Speed cameras</span></div>
  </div>
</body>
</html>
